include "frontend.conf"

appName="cis-contractor-frontend"

play.http.router = prod.Routes

play.http.errorHandler = "handlers.ErrorHandler"

play.modules.enabled += "uk.gov.hmrc.play.bootstrap.AuthModule"
play.modules.enabled += "uk.gov.hmrc.mongo.play.PlayMongoModule"
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.HttpClientV2Module"
play.modules.enabled += "config.Module"

play.filters.enabled += play.filters.csp.CSPFilter

play.i18n.langs = ["en", "cy"]

microservice {
    services {
      auth {
        protocol = http
        host     = localhost
        port     = 8500
      }

      feedback-frontend {
        protocol = http
        host     = localhost
        port     = 9514
      }

      construction-industry-scheme {
        protocol = http
        host     = localhost
        port     = 6994
      }

      construction-industry-scheme-external-stub {
        protocol = http
        host     = localhost
        port     = 6997
      }

      address-lookup-frontend {
        host = localhost
        port = 9028
      }
    }
}

contact-frontend {
  host      = "http://localhost:9250"
  serviceId = "construction-industry-scheme"
}

cis-frontend {
  host = "http://localhost:6993"
}

portal-account {
  host = "http://localhost:8095"
}

timeout-dialog {
  timeout   = 900
  countdown = 120
}

session {
  timeoutSeconds = 900
}

mongodb {
  uri                 = "mongodb://localhost:27017/"${appName}
  timeToLiveInSeconds = 900
  encryption.key      = "someLocalEncryptionKey=="
}

cis-manage-frontend {
  host = "http://localhost:6996"
}

cis-frontend {
  host = "http://localhost:6993"
}

urls {
  login                                     = "http://localhost:9949/auth-login-stub/gg-sign-in"
  loginContinue                             = "http://localhost:9000/cis-contractor-frontend"
  signOut                                   = "http://localhost:9553/bas-gateway/sign-out-without-state"
  govUkCISGuidance                          = "https://www.gov.uk/what-is-the-construction-industry-scheme"
  manageSubcontractors                      = "http://localhost:6996/construction-industry-scheme/management/manage-subcontractors"
  hmrcOnlineServiceDesk                     = "https://www.gov.uk/find-hmrc-contacts/technical-support-with-hmrc-online-services"
  cisGeneralEnquiries                       = "https://www.gov.uk/find-hmrc-contacts/construction-industry-scheme-general-enquiries"
  payeCisForAgentsOnlineService             = "https://www.gov.uk/guidance/payecis-for-agents-online-service"
  cisReturnDashboard                        = "http://localhost:6996/construction-industry-scheme/management/org/manage-construction-industry-service-account"
  fileStandardReturn                        = ${cis-frontend.host}"/construction-industry-scheme/monthly-return/file-your-monthly-return"
  fileNilReturn                             = ${cis-frontend.host}"/construction-industry-scheme/monthly-return/file-your-nil-return"
  findUtr                                   = "https://www.gov.uk/find-utr-number"
  manageFrontendBaseUrl                     = "http://localhost:6996/construction-industry-scheme/management"
  contactHMRC                               = "https://www.gov.uk/find-hmrc-contacts/construction-industry-scheme-general-enquiries"
  constructionIndustryAgentAccount          = ${cis-manage-frontend.host}"/construction-industry-scheme/management/agent/manage-construction-industry-scheme-account/"
  constructionIndustryOrgAccount            = ${cis-manage-frontend.host}"/construction-industry-scheme/management/org/manage-construction-industry-scheme-account"
  signIntoCIS                               = ${cis-manage-frontend.host}"/construction-industry-scheme/management/sign-into-cis"
  cisFrontendFinalValidationReturn          = ${cis-frontend.host}"/construction-industry-scheme/monthly-return/final-validations/return"
  subcontractorVerificationGuide            = "https://www.gov.uk/what-you-must-do-as-a-cis-contractor/verify-subcontractors"
  cisContractorGuide                        = "https://www.gov.uk/what-you-must-do-as-a-cis-contractor"
  authoriseClientRequest                    = "/account/authorise-client/agent/{agentCode}/request"
  taxAgentsAndAdvisorsAuthorisationForms    = "https://www.gov.uk/government/collections/tax-agents-and-advisors-authorisation-forms"
  clientListSearch                          = ${cis-manage-frontend.host}"/construction-industry-scheme/management/agent/file-monthly-cis-returns"
  manageCisReturn                           = ${cis-manage-frontend.host}"/construction-industry-scheme/management/manage-cis-return/"
  manageSubcontractorsLanding               = ${cis-manage-frontend.host}"/construction-industry-scheme/management/manage-subcontractors/"
  userResearchUrl                           = "https://survey.take-part-in-research.service.gov.uk/jfe/form/SV_74GjifgnGv6GsMC?Source=BannerList_HMRC_DASS_CIS"
}

host = "http://localhost:6998"

accessibility-statement{
  service-path = "/cis-contractor-frontend"
}

tracking-consent-frontend {
  gtm.container = "c"
}

play-frontend-hmrc {
    useRebrand = true,
    forceServiceNavigation = true
}


features {
  welsh-translation = true
  user-research-banner-enabled = true
}

submission-poll-timeout-seconds = 60
submission-poll-default-interval-seconds = 10

auditing {
  enabled = true
}
